name: PC VIRTUAL

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure 32GB+ Virtual Memory (Pagefile)
        shell: powershell
        run: |
          $ComputerSystem = Get-CimInstance -ClassName Win32_ComputerSystem
          Set-CimInstance -InputObject $ComputerSystem -Property @{AutomaticManagedPagefile = $False}

          $PageFile = Get-CimInstance -ClassName Win32_PageFileSetting
          if ($PageFile) {
              Set-CimInstance -InputObject $PageFile -Property @{InitialSize = 32768; MaximumSize = 32768}
          } else {
              New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = "C:\pagefile.sys"; InitialSize = 32768; MaximumSize = 32768}
          }

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $RdpPass = "A8#k" + [System.Guid]::NewGuid().ToString().Replace("-","").Substring(0,10) + "!"
          
          net user RDP $RdpPass /add /y
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          
          echo "RDP_PASS=$RdpPass" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: cmd
        run: |
          curl.exe -L -o tailscale.msi https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi
          msiexec.exe /i tailscale.msi /quiet /norestart
          del tailscale.msi

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID$tsIP = $null$retries = 0
          while (-not $tsIP -and$retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
          
